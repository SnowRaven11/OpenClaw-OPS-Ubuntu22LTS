name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + shellcheck
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck ripgrep python3

      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh

      - name: Run tests
        run: bash tests/run.sh
